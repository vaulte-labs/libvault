[package]
name = "libvault"
description = "Hardware-bound secrets vault"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/vaulte-labs/libvault"
homepage = "https://vaulte.caeser.workers.dev"
build = "build.rs"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
large_enum_variant = "allow"

[lib]
crate-type = ["lib"]

[[bin]]
name = "lvd"
required-features = ["broker"]

[features]
default = ["broker"]
# Everything that holds keys. Interfaces can leave it out and just talk to `lvd`.
broker = [
    "dep:base64",
    "dep:blind-rsa-signatures",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tungstenite",
    "dep:webpki-root-certs",
]
# Lets end-to-end tests stand in for a person. Never enabled in a release.
test-hooks = []
# Exposes parsers, and only parsers, to `cargo fuzz`. Never enabled in a release.
fuzz = []

[dependencies]
base64 = { version = "0.22", optional = true }
blind-rsa-signatures = { version = "0.18", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"], optional = true }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"], optional = true }
webpki-root-certs = { version = "1", optional = true }
argon2 = { version = "0.5", features = ["zeroize"] }
aws-lc-rs = "1.19"
bip39 = { version = "3", default-features = false, features = ["std"] }
snow = "0.10"
socket2 = { version = "0.6", features = ["all"] }
chacha20poly1305 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive", "serde"] }
png = "0.18"
psl = "2.1"

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tempfile = "3"

# These start the real lvd and stand in for a person, so they need both.
[[test]]
name = "flows"
required-features = ["broker", "test-hooks"]

[[test]]
name = "discovery"
required-features = ["broker", "test-hooks"]

[[test]]
name = "login"
required-features = ["broker", "test-hooks"]

[[test]]
name = "proxy"
required-features = ["broker", "test-hooks"]

[[test]]
name = "recovery"
required-features = ["broker", "test-hooks"]

[[test]]
name = "sync"
required-features = ["broker", "test-hooks"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# An arithmetic bug in code like this must stop it, never carry on with a wrapped number.
overflow-checks = true
